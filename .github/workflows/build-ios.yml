name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Pulse/**'
      - 'Pulse.xcodeproj/**'
      - '.github/workflows/build-ios.yml'
      - 'validate_project.py'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check project structure and show Xcode version
        run: |
          python3 validate_project.py
          xcodebuild -version

      # No Apple account, signing certificate, or repository secrets required.
      # Sideloadly signs the resulting IPA locally on the user's computer.
      - name: Build unsigned app for a physical iPhone
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project Pulse.xcodeproj \
            -scheme Pulse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package IPA for local signing
        run: |
          set -euo pipefail
          app_path="build/DerivedData/Build/Products/Release-iphoneos/Pulse.app"
          test -f "$app_path/Info.plist"
          test -f "$app_path/Pulse"
          mkdir -p build/package/Payload
          ditto "$app_path" build/package/Payload/Pulse.app
          ditto -c -k --keepParent build/package/Payload build/Pulse-unsigned.ipa
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/Pulse-unsigned.ipa') as package:
              assert package.testzip() is None
              assert 'Payload/Pulse.app/Info.plist' in package.namelist()
              assert 'Payload/Pulse.app/Pulse' in package.namelist()
          print('IPA structure verified. Install with Sideloadly after local signing.')
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-iPhone-unsigned
          path: build/Pulse-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
