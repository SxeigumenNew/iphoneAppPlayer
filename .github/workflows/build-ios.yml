name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Pulse/**'
      - 'Pulse.xcodeproj/**'
      - 'PulseUITests/**'
      - '.github/workflows/build-ios.yml'
      - 'validate_project.py'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check project structure and show Xcode version
        run: |
          python3 validate_project.py
          xcodebuild -version

      # No Apple account, signing certificate, or repository secrets required.
      # Sideloadly signs the resulting IPA locally on the user's computer.
      - name: Build unsigned app for a physical iPhone
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project Pulse.xcodeproj \
            -scheme Pulse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package IPA for local signing
        run: |
          set -euo pipefail
          app_path="build/DerivedData/Build/Products/Release-iphoneos/Pulse.app"
          test -f "$app_path/Info.plist"
          test -f "$app_path/Pulse"
          mkdir -p build/package/Payload
          ditto "$app_path" build/package/Payload/Pulse.app
          ditto -c -k --keepParent build/package/Payload build/Pulse-unsigned.ipa
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/Pulse-unsigned.ipa') as package:
              assert package.testzip() is None
              assert 'Payload/Pulse.app/Info.plist' in package.namelist()
              assert 'Payload/Pulse.app/Pulse' in package.namelist()
          print('IPA structure verified. Install with Sideloadly after local signing.')
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-iPhone-unsigned
          path: build/Pulse-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  ui-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          mkdir -p build
          xcrun simctl list devices available --json > build/simulators.json
          pulse_simulator_id=$(python3 - <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path
          devices = json.loads(Path('build/simulators.json').read_text())['devices']
          sdk = tuple(map(int, subprocess.check_output(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], text=True).strip().split('.')))
          candidates = []
          for runtime, values in devices.items():
              if '.iOS-' not in runtime:
                  continue
              version = tuple(map(int, re.findall(r'\d+', runtime.split('.iOS-')[1])))
              if version > sdk:
                  continue
              for device in values:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      candidates.append((version, device['udid'], device['name']))
          if not candidates:
              raise SystemExit('No available iPhone simulator found')
          version, udid, name = max(candidates)
          print(f'Using {name}, iOS {version}, Xcode simulator SDK {sdk}', file=sys.stderr)
          print(udid)
          PY
          )
          echo "device_id=$pulse_simulator_id" >> "$GITHUB_OUTPUT"

      - name: Check folder and file picker presentation
        run: |
          set -euo pipefail
          pulse_simulator_id='${{ steps.simulator.outputs.device_id }}'
          xcrun simctl boot "$pulse_simulator_id" || true
          python3 - "$pulse_simulator_id" <<'PY'
          import subprocess
          import sys
          subprocess.run(['xcrun', 'simctl', 'bootstatus', sys.argv[1], '-b'], timeout=240, check=True)
          PY
          xcodebuild \
            -project Pulse.xcodeproj \
            -scheme Pulse \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$pulse_simulator_id" \
            -derivedDataPath build/UITestDerivedData \
            -resultBundlePath build/ImportPickerTests.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:PulseUITests/ImportPickerTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            test 2>&1 | tee build/ui-tests.log

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-UI-test-results
          path: |
            build/ImportPickerTests.xcresult
            build/ui-tests.log
          if-no-files-found: ignore
          retention-days: 7

